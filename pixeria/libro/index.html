<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Libro de la estantería · Admira.shop</title>
    <meta name="description" content="Un libro de la estantería de la Cafetería de los Xpacios: cómpralo nuevo en Casa del Libro o búscalo de segunda mano.">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="stylesheet" href="/pixeria/pixeria.css">
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <a class="brand" href="/">Admira.Shop</a>
        <nav aria-label="Principal">
          <a href="/pixeria/">Muebles 3D</a>
          <a href="/pixeria/?seccion=libros">Libros</a>
          <a href="/">Robots</a>
          <a href="mailto:info@admira.com">Contacto</a>
        </nav>
      </header>
      <main id="app" aria-live="polite"><p class="estado">Cargando el libro…</p></main>
      <footer class="pie">
        <span><a href="/pixeria/?seccion=libros">← Libros de la estantería</a></span>
        <span>Libros de la estantería de la Cafetería de los Xpacios.</span>
      </footer>
    </div>
    <script>
// URL ESTABLE de cada libro (nota de Woz a #4407): https://admira.shop/pixeria/libro/?id=<slug>.
// Los QR de las cápsulas «¿Sabías que?» (#4415) apuntan aquí, así que esta ruta y el
// parámetro id NO se cambian aunque se rehaga la tienda. El id es el slug de la lista
// canónica de la estantería (pixeria.com, FLT-101048 + portadas de Casa del Libro), la
// misma que usan los modelos 3D y data/libros-estanteria.json; no hay una segunda lista.
// Esa lista da título, autor, portada y ficha de Casa del Libro; el JSON de la tienda
// añade (por el mismo slug) ISBN, edición, búsquedas de segunda mano y la ficha 3D.
(function () {
  'use strict';
  var CANONICA = 'https://www.pixeria.com/assets/xpaces/libros/estanteria-libros.json';
  var BASE = 'https://www.pixeria.com/assets/xpaces/libros/';
  var TIENDA = '/data/libros-estanteria.json';
  var app = document.getElementById('app');
  var id = (new URLSearchParams(location.search).get('id') || '').trim().toLowerCase();
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function json(url) { return fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function lista(titulo, libros) {
    app.innerHTML = '<section class="cabecera"><p class="eyebrow">Pixeria · Xpacios</p><h1>' + titulo + '</h1>' +
      '<p>Libros de la estantería de la Cafetería:</p></section><ul>' + libros.map(function (b) {
        return '<li><a href="/pixeria/libro/?id=' + encodeURIComponent(b.slug) + '">' + esc(b.titulo) + '</a> · ' + esc(b.autor) + '</li>';
      }).join('') + '</ul>';
  }
  Promise.all([json(CANONICA), json(TIENDA).catch(function () { return { libros: [] }; })]).then(function (r) {
    var libros = r[0].libros || [];
    var b = libros.filter(function (x) { return x.slug === id; })[0];
    if (!b) { document.title = 'Libros de la estantería · Admira.shop'; return lista(id ? 'No encuentro ese libro' : 'Libros de la estantería', libros); }
    var t = (r[1].libros || []).filter(function (x) { return x.slug === id; })[0] || {};
    var portada = b.portada_casadellibro || (b.portada_local ? BASE + b.portada_local : b.portada_espejo);
    var nuevo = b.casadellibro_url || (t.comprar_nuevo || {}).url || 'https://www.casadellibro.com/busqueda-generica?busqueda=' + encodeURIComponent(t.isbn || b.titulo);
    var q = encodeURIComponent(t.titulo_es || b.titulo);
    var sm = t.segunda_mano || {};
    var wallapop = sm.wallapop || 'https://es.wallapop.com/app/search?keywords=' + q;
    var ebay = sm.ebay || 'https://www.ebay.es/sch/i.html?_nkw=' + q + '&LH_ItemCondition=3000';
    document.title = b.titulo + ' · Libros · Admira.shop';
    app.innerHTML = '<section class="ficha">' +
      '<div>' + (portada ? '<img class="foto-ficha" src="' + esc(portada) + '" alt="Portada de ' + esc(b.titulo) + '">' : '') + '</div>' +
      '<div><p class="eyebrow">Estantería · Cafetería de los Xpacios</p><h1>' + esc(b.titulo) + '</h1>' +
        (t.titulo_es && t.titulo_es !== b.titulo ? '<p class="dims">En castellano: ' + esc(t.titulo_es) + '</p>' : '') +
        '<p class="autor">' + esc(b.autor) + '</p>' +
        (t.isbn ? '<p class="dims">ISBN <code>' + esc(t.isbn) + '</code>' + (t.edicion ? ' · ' + esc(t.edicion) : '') + '</p>' : '') +
        '<div class="compra"><p class="eyebrow">Comprar nuevo</p><a class="comprar comprar-libro" href="' + esc(nuevo) + '" target="_blank" rel="noopener">Casa del Libro ↗</a></div>' +
        '<div class="segunda-mano"><p class="eyebrow">Segunda mano</p><p class="aviso"><a href="' + esc(wallapop) + '" target="_blank" rel="noopener">Wallapop ↗</a> · ' +
          '<a href="' + esc(ebay) + '" target="_blank" rel="noopener">eBay ↗</a></p></div>' +
        (t.modelo_pixeria ? '<p class="aviso"><a href="/pixeria/?id=' + encodeURIComponent(t.modelo_pixeria) + '">Ver el libro en 3D, venderlo en Wallapop o eBay →</a></p>' : '') +
      '</div></section>';
  }).catch(function () {
    app.innerHTML = '<p class="estado">No he podido leer la lista de libros. Prueba de nuevo en un momento.</p>';
  });
})();
    </script>
  </body>
</html>
